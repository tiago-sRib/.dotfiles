# ~/.tmux.conf

# ============================================
# ESSENTIAL SETTINGS
# ============================================

# Fix Vim ESC delay (tmux 3.5+ already defaults to 10ms)
set -sg escape-time 5

# Increase scrollback buffer
set -g history-limit 50000

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Enable focus events for vim autoread
set -g focus-events on

# ── Terminal / color (WezTerm reports xterm-256color) ─────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -as terminal-features ",xterm-256color:clipboard"

# Aggressive resize for multi-client
setw -g aggressive-resize on


# ============================================
# KEY BINDINGS
# ============================================

# Change prefix to Ctrl+a (more ergonomic)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enter in vim style copy mode with v
bind-key v copy-mode

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Choose window menu
bind -n C-q choose-window

# Split in the current pane's directory
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# New windows always start at $HOME (not the current pane's path)
bind c new-window -c "#{HOME}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Easier and faster switching between next/prev window
bind -n C-k next-window
bind -n C-j previous-window

# ============================================
# APPEARANCE
# ============================================

# Status bar: session │ windows ....... pane path │ time │ date
# The path is the active pane's, with $HOME shown as ~ and long paths
# cut from the left (…/deep/dir).
set -g status-position bottom
set -g status-style 'bg=#13161d fg=#8b949e'
set -g status-left-length 20
set -g status-right-length 80
set -g status-left '#[fg=#00e68a,bold] #S #[fg=#30363d]│ '
set -g status-right '#[fg=#30363d]│#[fg=#c9d1d9] #{=/-40/…;s|^#{HOME}|~|:pane_current_path} #[fg=#30363d]│#[fg=#8b949e] %H:%M #[fg=#30363d]│#[fg=#8b949e] %d-%b-%y '

# Window status
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=#00e68a,bold] #I:#W '

# Pane border colors
set -g pane-border-style 'fg=#30363d'
set -g pane-active-border-style 'fg=#00e68a'

set -g pane-scrollbars off

# Message styling
set -g message-style 'bg=#00e68a fg=#000000 bold'

# ============================================
# COPY MODE
# ============================================

# OSC 52 clipboard sync (external = more secure)
set -s set-clipboard on

# Use vi keys
setw -g mode-keys vi

# Vi-style copy bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# ============================================
# PLUGINS (via TPM)
# ============================================

# TPM is cloned by ~/.github/bootstrap.sh; otherwise:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then press prefix + I to install the plugins.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Plugin settings
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'
